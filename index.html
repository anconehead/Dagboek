<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eetdagboek">
<title>Eetdagboek</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17221b;background:#f1f5f2}*{box-sizing:border-box}body{margin:0}.app{max-width:650px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}h1{margin:4px 0 5px;font-size:31px}p.sub{margin:0 0 16px;color:#657168}.card{background:#fff;border-radius:20px;padding:17px;margin:13px 0;box-shadow:0 4px 18px #193b2512}label,.label{display:block;font-weight:700;margin:14px 0 7px}select,textarea,input{width:100%;font:inherit;padding:12px;border:1px solid #c7d3ca;border-radius:12px;background:#fff;color:#17221b}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.alarms{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.alarms button,.secondary{border:1px solid #c7d3ca;background:#f7faf8;border-radius:11px;padding:11px 5px;font:inherit}.alarms button.on{background:#176b42;color:white;border-color:#176b42}.save{width:100%;border:0;border-radius:13px;margin-top:18px;padding:14px;background:#176b42;color:#fff;font:inherit;font-weight:750}.msg{display:none;margin-top:12px;padding:11px;border-radius:11px;background:#e7f3eb;color:#155d38}.msg.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:13px;color:#647168}.entry{padding:14px 0;border-top:1px solid #e2e9e4}.entry:first-child{border-top:0}.entry h3{margin:0 0 5px;font-size:17px}.food{white-space:pre-wrap;margin:5px 0}.meta{color:#667269;font-size:14px;line-height:1.5}.delete{border:0;background:#fff0ef;color:#a52a21;border-radius:9px;padding:7px 9px}.empty{text-align:center;color:#718077;padding:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.danger{color:#a52a21;background:#fff0ef;border-color:#f2c9c5}.privacy{text-align:center;color:#6b776f;font-size:13px}@media(max-width:480px){.alarms{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{color:#edf5ef;background:#111813}.card{background:#1c261f}select,textarea,input{background:#172019;color:#edf5ef;border-color:#46544a}.alarms button,.secondary{background:#172019;color:#edf5ef;border-color:#46544a}.entry{border-color:#334138}.msg{background:#253a2c;color:#a8e1ba}}
</style>
</head>
<body><main class="app">
<h1>🍽️ Mijn eetdagboek</h1><p class="sub">Je invoer wordt lokaal op dit apparaat bewaard.</p>
<section class="card"><h2>Nieuw eetmoment</h2>
<form id="form">
<label for="kind">Eetmoment</label><select id="kind"><option>Ontbijt</option><option>Lunch</option><option>Avondeten</option><option>Nachtsnack</option><option>Snack</option></select>
<label for="food">Wat heb je gegeten?</label><textarea id="food" required placeholder="Bijvoorbeeld: twee boterhammen met kaas"></textarea>
<div class="row"><div><label for="date">Datum</label><input id="date" type="date" required></div><div><label for="time">Tijdstip</label><input id="time" type="time" step="60" required></div></div>
<div class="label">Herinnering na</div><div class="alarms"><button type="button" data-min="0" class="on">Geen</button><button type="button" data-min="60">1 uur</button><button type="button" data-min="90">1,5 uur</button><button type="button" data-min="120">2 uur</button></div>
<button class="save" type="submit">Eetmoment opslaan</button><div id="msg" class="msg" aria-live="polite"></div>
</form></section>
<section class="card"><div class="top"><h2>Opgeslagen eetmomenten</h2><span id="count" class="badge"></span></div><div id="list"></div><div class="actions"><button id="export" type="button" class="secondary">Exporteer back-up</button><button id="clear" type="button" class="secondary danger">Wis alles</button></div></section>
<p class="privacy">De timestamp bevat datum én exact opslagtijdstip. Er wordt niets naar een server verzonden.</p>
</main>
<script>
(()=>{'use strict';const KEY='eetdagboek_v2';const $=s=>document.querySelector(s),form=$('#form'),kind=$('#kind'),food=$('#food'),date=$('#date'),time=$('#time'),list=$('#list'),msg=$('#msg'),count=$('#count');let alarm=0;let data=load();function pad(n){return String(n).padStart(2,'0')}function localDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function localTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}function resetDateTime(){const n=new Date();date.value=localDate(n);time.value=localTime(n)}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function stampNL(iso){return new Intl.DateTimeFormat('nl-NL',{dateStyle:'short',timeStyle:'medium'}).format(new Date(iso))}function eatMomentNL(x){return new Intl.DateTimeFormat('nl-NL',{dateStyle:'short',timeStyle:'short'}).format(new Date(x))}function alarmText(m){return m===60?'1 uur':m===90?'1,5 uur':m===120?'2 uur':'geen'}function show(t){msg.textContent=t;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),3500)}function render(){count.textContent=`${data.length} opgeslagen`;if(!data.length){list.innerHTML='<div class="empty">Nog niets opgeslagen.</div>';return}list.innerHTML=data.slice().sort((a,b)=>b.savedAt.localeCompare(a.savedAt)).map(x=>`<article class="entry"><div class="top"><h3>${esc(x.kind)} · ${eatMomentNL(x.eatenAt)}</h3><button class="delete" type="button" data-id="${x.id}">Verwijder</button></div><div class="food">${esc(x.food)}</div><div class="meta">Herinnering: ${alarmText(x.alarmMinutes)}<br>Timestamp opgeslagen: ${stampNL(x.savedAt)}</div></article>`).join('')}document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>{alarm=Number(b.dataset.min);document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('on',x===b))}));form.addEventListener('submit',e=>{e.preventDefault();const f=food.value.trim();if(!f){show('Vul in wat je hebt gegeten.');return}const eaten=new Date(`${date.value}T${time.value}:00`);if(Number.isNaN(eaten.getTime())){show('Kies een geldige datum en tijd.');return}data.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),kind:kind.value,food:f,eatenAt:eaten.toISOString(),alarmMinutes:alarm,savedAt:new Date().toISOString()});persist();render();food.value='';alarm=0;document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('on',x.dataset.min==='0'));resetDateTime();show('Eetmoment is lokaal opgeslagen.')}));list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;data=data.filter(x=>x.id!==b.dataset.id);persist();render()});$('#clear').addEventListener('click',()=>{if(data.length&&confirm('Alle opgeslagen eetmomenten wissen?')){data=[];persist();render()}});$('#export').addEventListener('click',()=>{if(!data.length){show('Er zijn nog geen gegevens om te exporteren.');return}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`eetdagboek-backup-${localDate(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});resetDateTime();render()})();
</script></body></html>
