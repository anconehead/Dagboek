<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#176b42">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Eetdagboek">

    <title>Mijn eetdagboek</title>

    <style>
        :root {
            color-scheme: light;

            --achtergrond: #f2f6f3;
            --kaart: #ffffff;
            --tekst: #17241c;
            --subtekst: #657269;
            --groen: #176b42;
            --groen-donker: #105332;
            --groen-licht: #e6f3ea;
            --rand: #cbd8cf;
            --rood: #aa2b22;
            --rood-licht: #fff0ef;
            --blauw-licht: #edf5ff;
            --blauw: #1e5fa7;
            --schaduw: 0 4px 18px rgba(25, 59, 37, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--achtergrond);
            color: var(--tekst);
        }

        .app {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;

            padding:
                calc(18px + env(safe-area-inset-top))
                14px
                calc(30px + env(safe-area-inset-bottom));
        }

        h1 {
            margin: 5px 0 4px;
            font-size: 31px;
        }

        .ondertitel {
            margin: 0 0 18px;
            color: var(--subtekst);
        }

        .kaart {
            margin-bottom: 15px;
            padding: 18px;

            background: var(--kaart);
            border-radius: 20px;
            box-shadow: var(--schaduw);
        }

        h2 {
            margin: 0 0 15px;
            font-size: 21px;
        }

        label,
        .label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 700;
        }

        select,
        textarea,
        input {
            width: 100%;
            min-height: 46px;

            padding: 12px 13px;

            font: inherit;
            color: var(--tekst);

            background: var(--kaart);

            border: 1px solid var(--rand);
            border-radius: 12px;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
            line-height: 1.45;
        }

        input:focus,
        textarea:focus,
        select:focus,
        button:focus-visible {
            outline: none;

            border-color: var(--groen);

            box-shadow:
                0 0 0 3px rgba(23, 107, 66, 0.16);
        }

        .datum-tijd {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .timer-keuzes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        .timer-knop {
            min-height: 45px;
            padding: 7px 5px;

            font: inherit;
            font-weight: 650;

            color: var(--tekst);
            background: #f7faf8;

            border: 1px solid var(--rand);
            border-radius: 11px;

            cursor: pointer;
        }

        .timer-knop.actief {
            color: white;
            background: var(--groen);
            border-color: var(--groen);
        }

        .timer-info {
            margin-top: 9px;

            font-size: 13px;
            line-height: 1.4;

            color: var(--subtekst);
        }

        .opslaan {
            width: 100%;
            min-height: 50px;

            margin-top: 19px;
            padding: 13px;

            font: inherit;
            font-weight: 750;
            font-size: 16px;

            color: white;
            background: var(--groen);

            border: 0;
            border-radius: 13px;

            cursor: pointer;
        }

        .opslaan:active {
            background: var(--groen-donker);
        }

        .melding {
            display: none;

            margin-top: 12px;
            padding: 11px 12px;

            color: var(--groen-donker);
            background: var(--groen-licht);

            border-radius: 11px;

            line-height: 1.4;
        }

        .melding.zichtbaar {
            display: block;
        }

        .kopregel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .aantal {
            color: var(--subtekst);
            font-size: 13px;
        }

        .daggroep {
            margin-top: 15px;
        }

        .dagtitel {
            margin: 0;
            padding: 9px 11px;

            color: var(--groen-donker);
            background: var(--groen-licht);

            border-radius: 10px;

            font-size: 15px;
            font-weight: 750;
        }

        .registratie {
            padding: 14px 2px;

            border-bottom:
                1px solid rgba(203, 216, 207, 0.7);
        }

        .registratie:last-child {
            border-bottom: 0;
        }

        .registratie-kop {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .registratie h3 {
            margin: 0;
            font-size: 17px;
        }

            margin: 7px 0;

            white-space: pre-wrap;
            overflow-wrap: anywhere
